<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dear Ariba!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
            position: relative;
        }

        /* Floating background hearts */
        .bg-heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            animation: floatUp 4s linear infinite;
            z-index: 1;
            font-size: 24px;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            position: relative;
            z-index: 2;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-7px); }
        }

        h1 {
            color: #ff4081;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #e91e63;
            font-weight: bold;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #ff4081;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }

        .btn:hover {
            background-color: #e0356f;
        }

        /* Confetti dots animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd700;
            top: -10px;
            border-radius: 50%;
            animation: fall 3s linear infinite;
            z-index: 3;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="bg-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="bg-heart" style="left: 25%; animation-delay: 1.5s;">💖</div>
    <div class="bg-heart" style="left: 45%; animation-delay: 0.7s;">❤️</div>
    <div class="bg-heart" style="left: 70%; animation-delay: 2.2s;">💗</div>
    <div class="bg-heart" style="left: 85%; animation-delay: 1s;">💖</div>

    <div class="card">
        <div class="icon">🎂</div>
        <h1>Happy Birthday</h1>
        <div class="subtitle">Dear Areeba! ❤️</div>
        <p>Wishing you a day filled with sweetness, endless smiles, and all the happiness your heart can hold!</p>
        <button class="btn" onclick="celebrate()">Click for Surprise! 🎉</button>
    </div>

    <script>
        // Fun celebration effect when button is clicked
        function celebrate() {
            alert(`🎉 Sending lots of love and best wishes to Dear Ariba! Have an amazing birthday! 🎂❤️`);
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff4081', '#ffd700', '#ff69b4', '#ff1493', '#ff6347'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 4000);
            }
        }
    </script>
</body>
</html>
